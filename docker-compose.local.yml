name: dijirota-local

services:
  db:
    image: mariadb:10.5
    container_name: kurumsalweb-dijirota-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: local_root_password
      MARIADB_DATABASE: dijirota
      MARIADB_USER: dijirota_user
      MARIADB_PASSWORD: local_password
    volumes:
      - dijirota_db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-plocal_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: kurumsalweb-dijirota-web
    restart: unless-stopped
    depends_on:
      blog:
        condition: service_healthy
      db:
        condition: service_healthy
    ports:
      - "8100:80"
    environment:
      BLOG_BRIDGE_SECRET: ${BLOG_BRIDGE_SECRET:?Blog kurulumu eksik}
      APP_ENV: local
      APP_URL: ${APP_URL:-http://localhost:8100}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: dijirota
      DB_USER: dijirota_user
      DB_PASSWORD: local_password
      ADMIN_SEED_EMAIL: admin@dijirota.com
      ADMIN_SEED_PASSWORD: DijirotaAdmin!2026
      PAYTR_MERCHANT_ID: ${PAYTR_MERCHANT_ID:-}
      PAYTR_MERCHANT_KEY: ${PAYTR_MERCHANT_KEY:-}
      PAYTR_MERCHANT_SALT: ${PAYTR_MERCHANT_SALT:-}
      PAYTR_TEST_MODE: ${PAYTR_TEST_MODE:-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BLOG_MODEL: ${OPENAI_BLOG_MODEL:-gpt-5.6-terra}
      OPENAI_BLOG_WEB_SEARCH: ${OPENAI_BLOG_WEB_SEARCH:-1}
      OPENAI_BLOG_VECTOR_STORE_ID: ${OPENAI_BLOG_VECTOR_STORE_ID:-}
      OPENAI_BLOG_MAX_OUTPUT_TOKENS: ${OPENAI_BLOG_MAX_OUTPUT_TOKENS:-12000}
      BLOG_AI_PROVIDER: ${BLOG_AI_PROVIDER:-nvidia}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_API_BASE_URL: ${NVIDIA_API_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_BLOG_MODEL: ${NVIDIA_BLOG_MODEL:-nvidia/nemotron-3.5-lightning-30b-a3b}
      NVIDIA_BLOG_MAX_OUTPUT_TOKENS: ${NVIDIA_BLOG_MAX_OUTPUT_TOKENS:-5000}
      NVIDIA_IMAGE_API_URL: ${NVIDIA_IMAGE_API_URL:-https://ai.api.nvidia.com/v1/genai/stabilityai/stable-diffusion-3-medium}
      NVIDIA_IMAGE_MODEL: ${NVIDIA_IMAGE_MODEL:-sd3}
    volumes:
      - ./:/var/www/html

  blog:
    build:
      context: ./blog-engine
    container_name: kurumsalweb-dijirota-blog
    restart: unless-stopped
    init: true
    environment:
      BLOG_BRIDGE_SECRET: ${BLOG_BRIDGE_SECRET:?Blog kurulumu eksik}
      BLOG_AI_PROVIDER: ${BLOG_AI_PROVIDER:-nvidia}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_TEXT_MODEL: ${NVIDIA_TEXT_MODEL:-nvidia/nemotron-3-super-120b-a12b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BLOG_TEXT_MODEL: ${BLOG_TEXT_MODEL:-gpt-5-mini}
      BLOG_IMAGE_MODEL: ${BLOG_IMAGE_MODEL:-gpt-image-1.5}
    volumes:
      - ./blog-engine/.blog-data:/app/.blog-data
      - ./blog-engine/content:/app/content
      - ./blog-engine/dist:/app/dist
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  dijirota_db_data:
